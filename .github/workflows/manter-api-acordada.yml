# O Render gratuito "dorme" depois de 15 min sem acesso, e o primeiro acesso leva ~1 min.
# Este ping passa pelo link público (Vercel → Render) e mantém a API acordada para o júri.
name: Manter API acordada

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/health
        env:
          URL_SITE: ${{ vars.URL_SITE || 'https://doacerto.vercel.app' }}
        run: |
          curl --silent --show-error --max-time 90 --retry 2 --retry-delay 20 "$URL_SITE/api/health"
